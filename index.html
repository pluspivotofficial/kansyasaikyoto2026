<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホップ感謝祭 2026.06.12 京都</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#F2A0AC;
  --pink-deep:#E8798C;
  --pink-pale:#FDF0F2;
  --cream:#FFF9F4;
  --blue:#9FD9DC;
  --blue-deep:#5FB7BC;
  --ink:#5A474C;
  --orange:#F59E2D;
  --orange-deep:#E8821A;
  --orange-pale:#FFF4E3;
  --gold:#D8B45A;
  --gold-light:#EFD9A0;
  --night:#1B1714;
  --shadow:0 10px 30px rgba(232,121,140,.18);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:"M PLUS Rounded 1c","Zen Maru Gothic",sans-serif;
  background:var(--cream);
  color:var(--ink);
  overflow:hidden;
}
#stage{position:fixed;inset:0;}

/* ===== slide base ===== */
.slide{
  position:absolute;inset:0;
  display:none;
  flex-direction:column;
  align-items:center;justify-content:center;
  padding:5vh 6vw 9vh;
  text-align:center;
  background:var(--cream);
  overflow:hidden;
}
.slide.active{display:flex;animation:pop .45s cubic-bezier(.2,.9,.3,1.2);}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(12px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion: reduce){
  .slide.active{animation:none;}
  .hopdot,.confetti i{animation:none !important;}
}

/* decorative blobs */
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;pointer-events:none;}
.b1{width:46vmin;height:46vmin;background:var(--pink-pale);top:-14vmin;left:-12vmin;}
.b2{width:34vmin;height:34vmin;background:#EAF7F7;bottom:-10vmin;right:-8vmin;}
.b3{width:16vmin;height:16vmin;background:var(--pink-pale);bottom:14vmin;left:8vmin;opacity:.7;}

.eyebrow{
  display:inline-block;
  font-family:"Zen Maru Gothic";
  font-weight:700;font-size:clamp(13px,1.6vmin,18px);
  letter-spacing:.35em;text-indent:.35em;
  color:var(--pink-deep);
  background:#fff;
  border:2px dashed var(--pink);
  border-radius:999px;
  padding:.5em 1.4em;
  margin-bottom:2.6vmin;
  position:relative;z-index:1;
}
h1,h2{font-family:"Zen Maru Gothic";position:relative;z-index:1;}
h1{font-size:clamp(34px,7.5vmin,84px);font-weight:900;line-height:1.25;}
h2{font-size:clamp(26px,5.4vmin,60px);font-weight:900;line-height:1.3;}
.sub{font-size:clamp(15px,2.3vmin,24px);font-weight:700;margin-top:2.2vmin;position:relative;z-index:1;}
.wavy{position:relative;display:inline-block;}
.wavy::after{
  content:"";position:absolute;left:0;right:0;bottom:-.18em;height:.16em;
  background:repeating-linear-gradient(135deg,var(--pink) 0 6px,transparent 6px 12px);
  border-radius:99px;
}

/* ===== title slide ===== */
.brandbar{position:absolute;top:0;left:0;right:0;height:1.6vmin;background:repeating-linear-gradient(90deg,var(--pink) 0 24px,var(--blue) 24px 48px);}
.logo{font-family:"Zen Maru Gothic";font-weight:900;position:relative;z-index:1;}
.logo .svc{display:block;font-size:clamp(12px,1.8vmin,18px);letter-spacing:.4em;color:var(--pink-deep);margin-bottom:.6vmin;}
.logo .nm{font-size:clamp(30px,5vmin,52px);color:var(--blue-deep);}
.logo .nm b{color:var(--pink-deep);}
.hopdots{display:flex;gap:1.4vmin;justify-content:center;margin:2.4vmin 0 1vmin;position:relative;z-index:1;}
.hopdot{width:2.6vmin;height:2.6vmin;min-width:12px;min-height:12px;border-radius:50%;background:var(--pink);animation:hop 1.5s ease-in-out infinite;}
.hopdot:nth-child(2){background:var(--blue);animation-delay:.15s;}
.hopdot:nth-child(3){background:var(--pink-deep);animation-delay:.3s;}
@keyframes hop{0%,100%{transform:translateY(0);}30%{transform:translateY(-1.6vmin);}50%{transform:translateY(0);}}
.datechip{
  display:inline-block;margin-top:3vmin;position:relative;z-index:1;
  background:var(--pink-deep);color:#fff;font-weight:800;
  font-size:clamp(16px,2.6vmin,28px);
  padding:.45em 1.6em;border-radius:999px;box-shadow:var(--shadow);
}
.footerband{position:absolute;bottom:0;left:0;right:0;height:7vmin;background:var(--pink);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:.12em;font-size:clamp(13px,2vmin,20px);}

/* ===== card layouts ===== */
.cardgrid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,42vw),1fr));
  gap:2vmin;width:min(1200px,92vw);margin-top:3vmin;position:relative;z-index:1;
}
.card{
  background:#fff;border-radius:24px;padding:2.6vmin 2.8vmin;
  box-shadow:var(--shadow);text-align:left;display:flex;gap:2vmin;align-items:flex-start;
  border:2px solid var(--pink-pale);
}
.card .ic{
  flex:0 0 auto;width:5.4vmin;height:5.4vmin;min-width:40px;min-height:40px;
  border-radius:50%;background:var(--pink-pale);
  display:flex;align-items:center;justify-content:center;font-size:2.8vmin;
}
.card h3{font-family:"Zen Maru Gothic";font-size:clamp(15px,2.3vmin,23px);font-weight:800;margin-bottom:.5vmin;color:var(--pink-deep);}
.card p{font-size:clamp(13px,1.9vmin,18px);font-weight:500;line-height:1.65;}

/* timeline */
.timeline{width:min(880px,90vw);margin-top:3.4vmin;position:relative;z-index:1;text-align:left;}
.trow{display:flex;align-items:center;gap:2.6vmin;padding:1.6vmin 0;position:relative;}
.trow::before{content:"";position:absolute;left:calc(9ch + 1.2vmin);top:0;bottom:0;width:3px;background:repeating-linear-gradient(var(--pink) 0 8px,transparent 8px 16px);}
.trow:first-child::before{top:50%;}
.trow:last-child::before{bottom:50%;}
.ttime{flex:0 0 9ch;font-family:"Zen Maru Gothic";font-weight:900;font-size:clamp(20px,3.4vmin,36px);color:var(--pink-deep);text-align:right;}
.tdot{flex:0 0 auto;width:2.4vmin;height:2.4vmin;min-width:14px;min-height:14px;border-radius:50%;background:#fff;border:.6vmin solid var(--pink);position:relative;z-index:1;}
.tlabel{font-weight:800;font-size:clamp(18px,3vmin,32px);background:#fff;border-radius:999px;padding:.35em 1em;box-shadow:var(--shadow);}

/* profile */
.profile{display:flex;align-items:center;gap:5vmin;width:min(1050px,92vw);margin-top:2vmin;position:relative;z-index:1;text-align:left;flex-wrap:wrap;justify-content:center;}
.avatar{
  width:30vmin;height:30vmin;min-width:180px;min-height:180px;border-radius:50%;
  background:linear-gradient(145deg,#fff,var(--pink-pale));
  border:1vmin solid #fff;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:11vmin;flex:0 0 auto;
}
.pbody h2{text-align:left;color:var(--blue-deep);}
.pbody .kana{font-size:clamp(16px,2.6vmin,26px);font-weight:800;margin-top:1vmin;}
.pbody .meta{font-size:clamp(14px,2.2vmin,22px);font-weight:600;margin-top:.6vmin;color:#7d6a6f;}
.ribbon{
  margin-top:3.4vmin;background:#fff;border:3px solid var(--pink);border-radius:24px;
  padding:1.8vmin 3vmin;font-weight:800;font-size:clamp(14px,2.4vmin,24px);
  box-shadow:var(--shadow);position:relative;z-index:1;line-height:1.7;
}

/* speaker (乾杯/閉会) */
.speaker-card{
  background:#fff;border-radius:32px;box-shadow:var(--shadow);
  padding:5vmin 7vmin;position:relative;z-index:1;border:2px solid var(--pink-pale);
}
.speaker-card .role{font-weight:700;font-size:clamp(14px,2.2vmin,22px);color:#8a777c;margin-top:2vmin;line-height:1.7;}
.speaker-card .nm{font-family:"Zen Maru Gothic";font-weight:900;font-size:clamp(34px,6.5vmin,72px);color:var(--pink-deep);margin-top:1.6vmin;}
.kanpai{font-size:9vmin;margin-bottom:1vmin;}

/* interlude */
.interlude{background:linear-gradient(160deg,#FDEFF1,#EAF7F7);}
.interlude h1{color:var(--pink-deep);}
.confetti{position:absolute;inset:0;pointer-events:none;}
.confetti i{
  position:absolute;width:1.4vmin;height:1.4vmin;min-width:8px;min-height:8px;border-radius:3px;
  background:var(--pink);opacity:.7;animation:fall 7s linear infinite;
}
@keyframes fall{from{transform:translateY(-12vh) rotate(0deg);}to{transform:translateY(112vh) rotate(540deg);}}

/* ===== quiz theme ===== */
.quiz{background:#FFF7F0;}
.quiz .qband{position:absolute;top:0;left:0;right:0;height:1.6vmin;background:repeating-linear-gradient(90deg,var(--orange) 0 24px,#FFD79A 24px 48px);}
.qnum{
  display:inline-flex;align-items:center;gap:1vmin;
  font-family:"Zen Maru Gothic";font-weight:900;color:#fff;
  background:var(--orange);border-radius:999px;
  font-size:clamp(15px,2.4vmin,24px);padding:.45em 1.4em;margin-bottom:2.4vmin;
  position:relative;z-index:1;box-shadow:0 8px 20px rgba(232,130,26,.25);
}
.quiz h2{color:var(--orange-deep);}
.choices{
  display:grid;grid-template-columns:1fr 1fr;gap:2.2vmin;
  width:min(1100px,92vw);margin-top:4vmin;position:relative;z-index:1;
}
.choice{
  background:#fff;border:.55vmin solid var(--orange);border-radius:24px;
  padding:3vmin 3vmin;display:flex;align-items:center;gap:2.4vmin;text-align:left;
  font-family:"Zen Maru Gothic";font-weight:900;font-size:clamp(20px,3.6vmin,40px);
  box-shadow:0 8px 0 rgba(232,130,26,.15);
}
.choice .mk{
  flex:0 0 auto;width:6vmin;height:6vmin;min-width:44px;min-height:44px;border-radius:50%;
  border:.5vmin solid var(--orange);color:var(--orange-deep);
  display:flex;align-items:center;justify-content:center;font-size:clamp(18px,3vmin,32px);
}
.anslabel{font-family:"Zen Maru Gothic";font-weight:900;color:var(--orange);font-size:clamp(40px,9vmin,110px);position:relative;z-index:1;}
.ansbox{
  display:inline-flex;align-items:center;gap:3vmin;margin-top:3vmin;
  background:#fff;border:.7vmin solid var(--orange);border-radius:28px;
  padding:3vmin 5vmin;font-family:"Zen Maru Gothic";font-weight:900;
  font-size:clamp(30px,6.5vmin,72px);box-shadow:0 10px 0 rgba(232,130,26,.15);
  position:relative;z-index:1;
}
.ansbox .mk{width:8vmin;height:8vmin;min-width:54px;min-height:54px;border-radius:50%;border:.6vmin solid var(--orange);color:var(--orange-deep);display:flex;align-items:center;justify-content:center;font-size:clamp(24px,4vmin,44px);flex:0 0 auto;}

/* quiz timer */
.timer{
  margin-top:4vmin;position:relative;z-index:2;display:flex;align-items:center;gap:2vmin;
  background:#fff;border-radius:999px;padding:1vmin 2.4vmin 1vmin 1vmin;
  box-shadow:var(--shadow);cursor:pointer;border:2px solid #FFE2BC;user-select:none;
}
.timer svg{width:6.6vmin;height:6.6vmin;min-width:48px;min-height:48px;transform:rotate(-90deg);}
.timer .tt{font-family:"Zen Maru Gothic";font-weight:900;font-size:clamp(16px,2.6vmin,26px);color:var(--orange-deep);}
.timer .hint{font-size:clamp(11px,1.6vmin,15px);font-weight:700;color:#b8927a;}
.timer.done .tt{color:var(--pink-deep);}

/* fact slides */
.factwrap{width:min(1150px,94vw);position:relative;z-index:1;margin-top:2.5vmin;}
.factcard{
  background:#fff;border-radius:28px;box-shadow:var(--shadow);
  padding:3.6vmin 4.5vmin;text-align:left;border:2px solid #FFE9D2;
}
.factcard dl{display:grid;grid-template-columns:auto 1fr;gap:.9vmin 2.4vmin;font-size:clamp(14px,2.3vmin,23px);}
.factcard dt{font-weight:900;color:var(--orange-deep);white-space:nowrap;}
.factcard dd{font-weight:600;line-height:1.6;}
.bignum{font-family:"Zen Maru Gothic";font-weight:900;font-size:clamp(46px,11vmin,130px);color:var(--orange);line-height:1.05;position:relative;z-index:1;}
.bignum small{font-size:.4em;color:var(--ink);}
.pillrow{display:flex;flex-wrap:wrap;gap:1.6vmin;justify-content:center;margin-top:2.6vmin;position:relative;z-index:1;}
.pill{background:#fff;border:2px solid var(--pink);border-radius:999px;padding:.5em 1.2em;font-weight:800;font-size:clamp(13px,2vmin,20px);box-shadow:var(--shadow);}
.pill.alt{border-color:var(--blue);}
.welfare{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,28vw),1fr));gap:1.8vmin;width:min(1200px,94vw);margin-top:3vmin;position:relative;z-index:1;}
.wcard{background:#fff;border-radius:22px;padding:2.2vmin;box-shadow:var(--shadow);border-top:.8vmin solid var(--pink);}
.wcard:nth-child(2n){border-top-color:var(--blue);}
.wcard:nth-child(3n){border-top-color:var(--orange);}
.wcard h3{font-family:"Zen Maru Gothic";font-size:clamp(14px,2.1vmin,20px);font-weight:800;margin-bottom:.6vmin;}
.wcard p{font-size:clamp(11px,1.6vmin,15px);font-weight:500;line-height:1.55;color:#7d6a6f;}
.rank-table{width:min(980px,92vw);margin-top:3vmin;border-collapse:separate;border-spacing:0 1vmin;position:relative;z-index:1;}
.rank-table th{font-size:clamp(12px,1.8vmin,17px);font-weight:800;color:#8a777c;padding:.4em;}
.rank-table td{
  background:#fff;padding:1.2vmin 1.6vmin;font-weight:800;font-size:clamp(13px,2.2vmin,22px);
  box-shadow:var(--shadow);
}
.rank-table tr td:first-child{border-radius:16px 0 0 16px;font-family:"Zen Maru Gothic";font-weight:900;}
.rank-table tr td:last-child{border-radius:0 16px 16px 0;}
.rank-table tr.hl td{background:#FFF2D6;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);}
.rank-table tr.hl td:first-child{border-left:2px solid var(--gold);}
.rank-table tr.hl td:last-child{border-right:2px solid var(--gold);}

.goalbar{width:min(900px,90vw);height:6vmin;min-height:38px;background:#fff;border-radius:999px;box-shadow:var(--shadow);margin-top:3.5vmin;position:relative;z-index:1;overflow:hidden;border:2px solid var(--pink-pale);}
.goalbar .fill{height:100%;width:35%;background:linear-gradient(90deg,var(--pink),var(--pink-deep));border-radius:999px;display:flex;align-items:center;justify-content:flex-end;color:#fff;font-weight:900;padding-right:1.4em;font-size:clamp(13px,2.2vmin,22px);}

/* ===== award theme ===== */
.award{background:radial-gradient(120% 120% at 50% 0%,#2A241E 0%,var(--night) 70%);color:#F4E9D2;}
.award::before,.award::after{
  content:"";position:absolute;left:3vmin;right:3vmin;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.award::before{top:3.5vmin;}
.award::after{bottom:3.5vmin;}
.award .eyebrow{color:var(--gold);border-color:var(--gold);background:transparent;border-style:solid;}
.award h1,.award h2{color:var(--gold-light);}
.award .serifish{font-weight:700;letter-spacing:.12em;}
.gp-num{font-family:"Zen Maru Gothic";font-weight:900;font-size:clamp(56px,13vmin,160px);color:#fff;line-height:1;position:relative;z-index:1;text-shadow:0 0 30px rgba(216,180,90,.35);}
.gp-num small{font-size:.35em;color:var(--gold);}
.gp-cap{margin-top:2.4vmin;font-size:clamp(14px,2.2vmin,22px);font-weight:600;line-height:1.9;color:#D9CBAE;position:relative;z-index:1;}
.gp-cap b{color:var(--gold-light);}
.gp-label{font-size:clamp(14px,2.2vmin,22px);font-weight:800;color:var(--gold);letter-spacing:.25em;text-indent:.25em;margin-bottom:1.5vmin;position:relative;z-index:1;}
.winner{font-family:"Zen Maru Gothic";font-weight:900;font-size:clamp(40px,9vmin,110px);color:#fff;position:relative;z-index:1;text-shadow:0 2px 0 rgba(0,0,0,.4),0 0 40px rgba(216,180,90,.3);}
.trophy{font-size:10vmin;margin-bottom:1vmin;filter:drop-shadow(0 0 18px rgba(216,180,90,.5));}
.gline{width:min(560px,70vw);height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:2.6vmin auto;position:relative;z-index:1;}
.award .sub{color:#D9CBAE;}

/* night/photo slide */
.dusk{background:linear-gradient(180deg,#3A4A6B 0%,#7A5E72 55%,#C97E6F 100%);color:#FFF4E3;}
.dusk h1,.dusk h2{color:#FFEFC9;}
.dusk .card{background:rgba(255,255,255,.12);border-color:rgba(255,239,201,.4);backdrop-filter:blur(4px);}
.dusk .card h3{color:#FFEFC9;}
.dusk .card p{color:#FFF6E6;}
.dusk .card .ic{background:rgba(255,239,201,.18);}

/* ===== chrome (nav UI) ===== */
#progress{position:fixed;left:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--pink),var(--blue));width:0;z-index:50;transition:width .25s;border-radius:0 99px 99px 0;}
#counter{
  position:fixed;bottom:14px;right:16px;z-index:50;
  background:#fff;color:var(--ink);font-weight:800;font-size:13px;
  border-radius:999px;padding:6px 14px;box-shadow:var(--shadow);
}
.navbtn{
  position:fixed;top:50%;transform:translateY(-50%);z-index:50;
  width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;
  background:#fff;box-shadow:var(--shadow);font-size:18px;color:var(--pink-deep);
  font-weight:900;opacity:.85;transition:.15s;
}
.navbtn:hover{opacity:1;transform:translateY(-50%) scale(1.08);}
.navbtn:focus-visible{outline:3px solid var(--blue-deep);}
#prev{left:14px;}
#next{right:14px;}
#menuBtn{
  position:fixed;bottom:14px;left:16px;z-index:50;border:none;cursor:pointer;
  background:#fff;color:var(--ink);font-weight:800;font-size:13px;
  border-radius:999px;padding:6px 14px;box-shadow:var(--shadow);font-family:inherit;
}
#menu{
  position:fixed;inset:0;z-index:60;background:rgba(90,71,76,.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:4vmin;
}
#menu.open{display:flex;}
#menu .panel{
  background:var(--cream);border-radius:24px;padding:3vmin;max-height:84vh;overflow:auto;
  width:min(900px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3);
}
#menu h3{font-family:"Zen Maru Gothic";color:var(--pink-deep);margin-bottom:1.6vmin;font-size:18px;}
#menu .jump{display:flex;flex-wrap:wrap;gap:8px;}
#menu .jump button{
  border:2px solid var(--pink-pale);background:#fff;border-radius:999px;
  padding:6px 14px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink);
}
#menu .jump button:hover{border-color:var(--pink);}
.kbd-hint{position:fixed;bottom:46px;right:16px;z-index:50;font-size:11px;color:#a98f95;font-weight:700;}
@media(max-width:640px){
  .choices{grid-template-columns:1fr;}
  .kbd-hint{display:none;}
}
</style>
</head>
<body>
<div id="stage"></div>

<button class="navbtn" id="prev" aria-label="前のスライド">‹</button>
<button class="navbtn" id="next" aria-label="次のスライド">›</button>
<div id="progress"></div>
<div id="counter">1 / 1</div>
<button id="menuBtn">📑 もくじ</button>
<div class="kbd-hint">← → キーで移動 / F で全画面</div>

<div id="menu" role="dialog" aria-label="スライド一覧">
  <div class="panel">
    <h3>🌸 もくじ（クリックでジャンプ）</h3>
    <div class="jump" id="jumpList"></div>
  </div>
</div>

<script>
/* ====== quiz data ====== */
const QUIZ = [
  {n:"①", q:"プラス・ピボットの創業日は？", c:["2022年4月","2023年4月","2021年10月","2024年1月"], a:1},
  {n:"➁", q:"プラス・ピボットの社長の名前は？", c:["山本 直樹","山田 直生","山本 直生","山口 直生"], a:2},
  {n:"③", q:"現在の事業所数はいくつ？（事務センター含む）<br><span style='font-size:.55em'>※日本国内のみ</span>", c:["8拠点","9拠点","10拠点","11拠点"], a:3},

/* ====== render & nav ====== */
const stage=document.getElementById("stage");
stage.innerHTML=S.join("");
const slides=[...document.querySelectorAll(".slide")];
let idx=0;
const counter=document.getElementById("counter");
const progress=document.getElementById("progress");

function show(i){
  idx=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,j)=>s.classList.toggle("active",j===idx));
  counter.textContent=`${idx+1} / ${slides.length}`;
  progress.style.width=((idx+1)/slides.length*100)+"%";
  location.hash="s"+(idx+1);
}
document.getElementById("next").onclick=()=>show(idx+1);
document.getElementById("prev").onclick=()=>show(idx-1);
document.addEventListener("keydown",e=>{
  if(e.target.closest("#menu"))return;
  if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)){e.preventDefault();show(idx+1);}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();show(idx-1);}
  else if(e.key==="Home"){show(0);}
  else if(e.key==="End"){show(slides.length-1);}
  else if(e.key.toLowerCase()==="f"){
    if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  }
  else if(e.key==="Escape"){menu.classList.remove("open");}
});
/* tap right/left half on touch devices (ignore timer & buttons) */
stage.addEventListener("click",e=>{
  if(e.target.closest(".timer"))return;
  const x=e.clientX/innerWidth;
  if(x>0.66)show(idx+1); else if(x<0.34)show(idx-1);
});

/* menu */
const menu=document.getElementById("menu");
const jump=document.getElementById("jumpList");
slides.forEach((s,i)=>{
  const b=document.createElement("button");
  b.textContent=`${i+1}. ${s.dataset.title}`;
  b.onclick=()=>{show(i);menu.classList.remove("open");};
  jump.appendChild(b);
});
document.getElementById("menuBtn").onclick=()=>menu.classList.toggle("open");
menu.addEventListener("click",e=>{if(e.target===menu)menu.classList.remove("open");});

/* timers */
const timers=new Map();
document.querySelectorAll(".timer").forEach(t=>{
  const ring=t.querySelector(".ring");
  const tt=t.querySelector(".tt");
  const C=163.4;
  function reset(){clearInterval(timers.get(t));timers.delete(t);ring.style.strokeDashoffset=0;ring.style.stroke="#F59E2D";tt.textContent="⏱ 60秒";t.classList.remove("done");}
  function start(){
    let remain=60;tt.textContent="⏱ 60秒";
    const id=setInterval(()=>{
      remain--;
      ring.style.strokeDashoffset=C*(1-remain/60);
      tt.textContent="⏱ "+remain+"秒";
      if(remain<=10)ring.style.stroke="#E8798C";
      if(remain<=0){clearInterval(id);timers.delete(t);tt.textContent="⏰ 終了！";t.classList.add("done");}
    },1000);
    timers.set(t,id);
  }
  function toggle(e){e.stopPropagation();if(timers.has(t)||t.classList.contains("done"))reset();else start();}
  t.addEventListener("click",toggle);
  t.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle(e);}});
});

/* start (respect hash) */
const m=location.hash.match(/^#s(\d+)$/);
show(m?+m[1]-1:0);
