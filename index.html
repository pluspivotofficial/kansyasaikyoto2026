<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホップ感謝祭 2026.06.12 梅田</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Zen+Maru+Gothic:wght@500;700;900&family=Playfair+Display:ital,wght@0,600;0,800;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#F08A8A; --pink-deep:#E06A77; --pink-soft:#FAD2D2; --pink-bg:#FFF5F3;
  --blue:#8FCFD8; --blue-soft:#DDF1F4;
  --cream:#FFFBF6; --ink:#5A4040; --ink-soft:#9A7C7C;
  --board:#4E7263; --board-deep:#3E5C50; --chalk:#FFF9EE;
  --gold:#D9B14A; --gold-soft:#F0DCA0; --night:#17130E; --night-2:#221C14;
  --shadow:0 12px 34px rgba(224,106,119,.16);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'M PLUS Rounded 1c','Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  background:var(--pink-bg); color:var(--ink); user-select:none;
}
#stage{position:fixed;inset:0;perspective:1600px;}
.slide{
  position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;
  padding:5vh 6vw 11vh;text-align:center;background:var(--pink-bg);
  overflow:hidden;transform-origin:left center;backface-visibility:hidden;
}
.slide.active{display:flex;animation:flipIn .55s cubic-bezier(.25,.85,.35,1.05);}
.slide.active.back{animation:flipBack .5s cubic-bezier(.25,.85,.35,1.05);}
@keyframes flipIn{from{opacity:0;transform:rotateY(-14deg) translateX(40px);}to{opacity:1;transform:none;}}
@keyframes flipBack{from{opacity:0;transform:rotateY(10deg) translateX(-40px);}to{opacity:1;transform:none;}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.3,1.1) both;}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}.rise.d3{animation-delay:.24s}.rise.d4{animation-delay:.32s}.rise.d5{animation-delay:.40s}.rise.d6{animation-delay:.48s}
@keyframes rise{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.slide.active,.slide.active.back,.rise{animation:none!important;}}

/* ===== 背景テクスチャ ===== */
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(240,138,138,.10) 2.5px,transparent 2.5px);
  background-size:34px 34px;}
.t-board{background:var(--board);color:var(--chalk);}
.t-board::before{background-image:radial-gradient(rgba(255,249,238,.05) 2px,transparent 2px);}
.t-gold{background:var(--night);color:var(--gold-soft);}
.t-gold::before{background-image:radial-gradient(rgba(217,177,74,.07) 2px,transparent 2px);}

/* ===== 共通パーツ ===== */
.eyebrow{display:inline-flex;align-items:center;gap:.5em;background:#fff;
  border:3px solid var(--pink-soft);color:var(--pink-deep);font-weight:800;
  font-size:clamp(13px,1.8vmin,18px);letter-spacing:.14em;
  padding:.45em 1.5em;border-radius:999px;box-shadow:var(--shadow);margin-bottom:3.2vh;}
.t-board .eyebrow{background:rgba(255,249,238,.12);border-color:rgba(255,249,238,.35);color:var(--chalk);box-shadow:none;}
.t-gold .eyebrow{background:transparent;border:1.5px solid var(--gold);color:var(--gold);
  border-radius:4px;letter-spacing:.34em;font-family:'Playfair Display',serif;font-weight:600;box-shadow:none;}
h1{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;
  font-size:clamp(34px,8.2vmin,86px);line-height:1.25;letter-spacing:.04em;}
h2{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;
  font-size:clamp(26px,5.6vmin,58px);line-height:1.3;}
.accent{color:var(--pink-deep);}
.lead{font-size:clamp(15px,2.4vmin,24px);font-weight:700;line-height:2;color:var(--ink);}
.card{background:#fff;border-radius:26px;box-shadow:var(--shadow);padding:3.4vh 3.2vw;color:var(--ink);}
.deco{position:absolute;font-size:clamp(28px,5vmin,54px);opacity:.5;pointer-events:none;animation:float 5.5s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-16px) rotate(6deg);}}

/* バンティング（クイズ） */
.bunting{position:absolute;top:0;left:0;right:0;height:9vh;pointer-events:none;display:flex;justify-content:space-around;}
.bunting i{width:0;height:0;border-left:2.4vmin solid transparent;border-right:2.4vmin solid transparent;border-top:4.4vmin solid;transform:translateY(-4px);}
.bunting i:nth-child(5n+1){border-top-color:#F6B4B4;}
.bunting i:nth-child(5n+2){border-top-color:#FBE3A0;}
.bunting i:nth-child(5n+3){border-top-color:#AEDCC9;}
.bunting i:nth-child(5n+4){border-top-color:#B9C8F2;}
.bunting i:nth-child(5n+5){border-top-color:#F2C2DF;}

/* ===== タイトル ===== */
.logo-chip{display:inline-block;background:#fff;border-radius:999px;padding:.5em 1.6em;
  font-weight:900;font-size:clamp(15px,2.3vmin,22px);color:var(--pink-deep);
  border:3px solid var(--pink-soft);box-shadow:var(--shadow);margin-bottom:3vh;letter-spacing:.1em;}
.title-date{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(18px,3.4vmin,34px);
  color:var(--ink-soft);letter-spacing:.3em;margin-top:3.4vh;}
.title-band{position:absolute;left:0;right:0;height:1.6vh;background:repeating-linear-gradient(90deg,var(--pink) 0 26px,var(--pink-soft) 26px 52px);}
.band-top{top:0}.band-bottom{bottom:0}

/* ===== 司会者 ===== */
.mc-card{display:flex;gap:3vw;align-items:center;max-width:min(92vw,980px);text-align:left;}
.mc-avatar{width:clamp(120px,22vmin,220px);height:clamp(120px,22vmin,220px);border-radius:50%;
  background:linear-gradient(145deg,var(--blue-soft),var(--pink-soft));
  display:flex;align-items:center;justify-content:center;font-size:clamp(48px,9vmin,90px);
  border:6px solid #fff;box-shadow:var(--shadow);flex-shrink:0;}
.mc-name{font-family:'Zen Maru Gothic';font-weight:900;font-size:clamp(30px,5.8vmin,58px);color:var(--pink-deep);line-height:1.2;}
.mc-real{font-weight:800;font-size:clamp(16px,2.7vmin,26px);margin-top:1vh;}
.mc-meta{font-weight:700;font-size:clamp(14px,2.2vmin,21px);color:var(--ink-soft);margin-top:.6vh;line-height:1.8;}
.mc-fun{margin-top:2vh;background:var(--pink-bg);border:2.5px dashed var(--pink);border-radius:18px;
  padding:1.4vh 1.6vw;font-weight:800;font-size:clamp(13px,2.2vmin,20px);line-height:1.9;color:var(--pink-deep);}

/* ===== 注意事項 ===== */
.notes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.8vh 1.6vw;max-width:min(94vw,1080px);width:100%;}
.note{display:flex;gap:1.2vw;align-items:flex-start;text-align:left;background:#fff;border-radius:20px;
  padding:2vh 1.6vw;box-shadow:var(--shadow);}
.note .ic{width:clamp(40px,6.4vmin,60px);height:clamp(40px,6.4vmin,60px);border-radius:50%;flex-shrink:0;
  background:var(--pink-soft);display:flex;align-items:center;justify-content:center;font-size:clamp(19px,3.1vmin,30px);}
.note h3{font-size:clamp(14px,2.3vmin,21px);font-weight:900;color:var(--pink-deep);margin-bottom:.4vh;}
.note p{font-size:clamp(11.5px,1.85vmin,16.5px);font-weight:600;line-height:1.75;color:var(--ink);}

/* ===== スケジュール ===== */
.tl{max-width:min(90vw,860px);width:100%;text-align:left;}
.tl-item{display:flex;align-items:center;gap:2vw;padding:1.5vh 0;}
.tl-time{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(20px,3.8vmin,40px);
  color:var(--pink-deep);min-width:5.6em;text-align:right;}
.tl-dotcol{display:flex;flex-direction:column;align-items:center;align-self:stretch;}
.tl-dot{width:16px;height:16px;border-radius:50%;background:var(--pink);border:4px solid #fff;box-shadow:0 0 0 3px var(--pink-soft);}
.tl-line{flex:1;width:3px;background:var(--pink-soft);}
.tl-item:last-child .tl-line{background:transparent;}
.tl-label{font-weight:900;font-size:clamp(17px,3.2vmin,32px);display:flex;align-items:center;gap:.5em;}

/* ===== クイズ ===== */
.q-no{display:inline-block;background:var(--gold-soft);color:#7A5A12;font-weight:900;
  border-radius:999px;padding:.35em 1.3em;font-size:clamp(13px,2vmin,19px);letter-spacing:.12em;margin-bottom:2.4vh;}
.q-text{font-family:'Zen Maru Gothic';font-weight:900;font-size:clamp(24px,4.8vmin,50px);
  line-height:1.45;margin-bottom:4vh;color:var(--chalk);}
.q-hl{color:#FBE3A0;border-bottom:4px dotted rgba(251,227,160,.6);padding-bottom:.06em;}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.8vh 1.8vw;width:100%;max-width:min(92vw,1000px);}
.opt{background:rgba(255,249,238,.96);color:var(--ink);border-radius:18px;border:3px solid #C98F4B;
  padding:2.3vh 1.4vw;font-weight:900;font-size:clamp(16px,2.9vmin,30px);display:flex;align-items:center;gap:.7em;justify-content:flex-start;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.18);}
.opt b{color:#C9701E;font-family:'Playfair Display',serif;font-size:1.1em;}
.ans-stamp{font-family:'Zen Maru Gothic';font-weight:900;font-size:clamp(26px,6vmin,60px);
  color:#FBE3A0;letter-spacing:.4em;margin-bottom:3.4vh;}
.ans-box{background:rgba(255,249,238,.97);color:var(--ink);border:4px solid #C98F4B;border-radius:22px;
  padding:4vh 5vw;font-weight:900;font-size:clamp(26px,5.6vmin,58px);box-shadow:0 8px 0 rgba(0,0,0,.2);line-height:1.45;}
.ans-box b{color:#C9701E;font-family:'Playfair Display',serif;margin-right:.4em;}

/* ===== 情報スライド ===== */
.info-card{max-width:min(92vw,980px);width:100%;text-align:left;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1.1vh 1.8vw;font-size:clamp(13.5px,2.25vmin,21px);font-weight:700;line-height:1.85;color:var(--ink);}
.kv dt{color:var(--pink-deep);font-weight:900;white-space:nowrap;}
.pill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,40vw),1fr));gap:1.4vh 1.2vw;}
.pill{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:1.8vh 1.4vw;text-align:left;}
.pill h4{font-size:clamp(13.5px,2.2vmin,20px);font-weight:900;color:var(--pink-deep);margin-bottom:.5vh;display:flex;align-items:center;gap:.45em;}
.pill p{font-size:clamp(11.5px,1.8vmin,16px);font-weight:600;line-height:1.7;color:var(--ink);}
.stat-big{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(54px,13vmin,140px);
  color:var(--pink-deep);line-height:1.05;}
.stat-label{font-weight:900;font-size:clamp(15px,2.6vmin,26px);color:var(--ink-soft);letter-spacing:.1em;}
.rank-table{border-collapse:collapse;width:100%;max-width:min(92vw,880px);background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);}
.rank-table th,.rank-table td{padding:1.25vh 1.2vw;font-size:clamp(12px,1.95vmin,18px);font-weight:800;border-bottom:1.5px solid #F5E3E3;color:var(--ink);}
.rank-table th{background:var(--pink-soft);color:#8A3A46;letter-spacing:.06em;}
.rank-table tr.hot td{background:#FFF1D6;color:#7A5A12;}
.rank-table td:first-child{color:var(--pink-deep);}

/* ===== GOLD ===== */
.gold-title{font-family:'Playfair Display','Zen Maru Gothic',serif;font-weight:800;
  font-size:clamp(40px,9vmin,100px);color:var(--gold);letter-spacing:.06em;line-height:1.2;
  text-shadow:0 4px 30px rgba(217,177,74,.35);}
.gold-sub{font-family:'Playfair Display',serif;letter-spacing:.5em;color:rgba(240,220,160,.55);
  font-size:clamp(11px,1.7vmin,16px);margin-top:2.6vh;text-transform:uppercase;}
.gold-frame{position:absolute;inset:2.4vh 2.4vw;border:1.5px solid rgba(217,177,74,.5);border-radius:6px;pointer-events:none;}
.gold-frame::after{content:"";position:absolute;inset:8px;border:1px solid rgba(217,177,74,.25);border-radius:4px;}
.award-name{font-family:'Zen Maru Gothic',serif;font-weight:900;font-size:clamp(38px,8.4vmin,92px);
  color:#fff;letter-spacing:.06em;line-height:1.3;text-shadow:0 3px 26px rgba(217,177,74,.3);}
.award-stat{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(50px,12vmin,130px);color:#fff;line-height:1.05;}
.award-stat small{font-size:.42em;color:var(--gold);letter-spacing:.08em;}
.gold-divider{width:min(60vw,440px);height:1.5px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:2.8vh auto;}
.gold-note{color:rgba(240,220,160,.85);font-weight:600;font-size:clamp(13px,2.15vmin,20px);line-height:2;}
.gold-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.6vw;max-width:min(94vw,1040px);width:100%;}
.gcard{border:1.5px solid rgba(217,177,74,.55);border-radius:8px;padding:3vh 1.4vw;background:rgba(217,177,74,.05);}
.gcard .ic{font-size:clamp(26px,4.6vmin,44px);margin-bottom:1.4vh;}
.gcard h4{font-family:'Zen Maru Gothic';font-weight:900;color:var(--gold);font-size:clamp(15px,2.6vmin,25px);margin-bottom:1vh;letter-spacing:.12em;}
.gcard p{font-size:clamp(11.5px,1.85vmin,16.5px);font-weight:600;color:rgba(255,249,238,.85);line-height:1.8;}
.trophy{font-size:clamp(56px,11vmin,110px);margin-bottom:2vh;filter:drop-shadow(0 6px 22px rgba(217,177,74,.45));}

/* ===== QR ===== */
.qr-wrap{background:#fff;border-radius:24px;padding:2.6vh 2.6vh;box-shadow:var(--shadow);display:inline-block;}
.qr-wrap img{width:clamp(180px,34vmin,330px);height:auto;display:block;image-rendering:pixelated;}

/* ===== ナビ ===== */
#progress{position:fixed;left:0;top:0;height:5px;background:linear-gradient(90deg,var(--pink),var(--gold));width:0;z-index:60;transition:width .3s;border-radius:0 4px 4px 0;}
#hud{position:fixed;bottom:2.2vh;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:2.4vw;z-index:60;pointer-events:none;}
#hud .btn{pointer-events:auto;background:#fff;border:3px solid var(--pink-soft);color:var(--pink-deep);
  font-family:inherit;font-weight:900;font-size:clamp(15px,2.3vmin,21px);width:clamp(44px,7vmin,60px);height:clamp(44px,7vmin,60px);
  border-radius:50%;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;}
#hud .btn:hover{transform:scale(1.1);}
#hud .btn:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px;}
#counter{background:rgba(255,255,255,.92);border-radius:999px;padding:.5em 1.4em;font-weight:900;
  font-size:clamp(12.5px,1.95vmin,17px);color:var(--ink-soft);box-shadow:var(--shadow);letter-spacing:.1em;}
.hint{position:fixed;bottom:9.4vh;left:50%;transform:translateX(-50%);font-size:clamp(11px,1.7vmin,14px);
  font-weight:700;color:var(--ink-soft);opacity:.75;z-index:55;background:rgba(255,255,255,.85);padding:.35em 1.2em;border-radius:999px;}
@media (max-width:720px){
  .opts,.notes-grid{grid-template-columns:1fr;}
  .gold-cards{grid-template-columns:1fr;gap:1.4vh;}
  .mc-card{flex-direction:column;text-align:center;}
  .slide{padding:4vh 6vw 13vh;}
}
</style>
</head>
<body>
<div id="progress"></div>
<div id="stage" aria-live="polite"></div>
<div class="hint" id="hint">← → キー / クリック / スワイプ でページ移動</div>
<div id="hud">
  <button class="btn" id="prevBtn" aria-label="前のスライド">←</button>
  <span id="counter">1 / 64</span>
  <button class="btn" id="nextBtn" aria-label="次のスライド">→</button>
</div>

/* ============ レンダリング & ナビ ============ */
const stage = document.getElementById("stage");
slides.forEach((s,i)=>{
  const d = document.createElement("section");
  d.className = "slide "+s.cls;
  d.dataset.idx = i;
  d.innerHTML = s.html;
  stage.appendChild(d);
});
const els = [...document.querySelectorAll(".slide")];
let cur = 0;
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
const hint = document.getElementById("hint");

function show(n, back=false){
  if(n<0||n>=els.length) return;
  els[cur].classList.remove("active","back");
  cur = n;
  const el = els[cur];
  el.classList.add("active");
  if(back) el.classList.add("back");
  // re-trigger rise animations
  el.querySelectorAll(".rise").forEach(r=>{r.style.animation="none";void r.offsetWidth;r.style.animation="";});
  counter.textContent = (cur+1)+" / "+els.length;
  progress.style.width = ((cur+1)/els.length*100)+"%";
  if(cur>0 && hint) hint.style.display="none";
}
const next = ()=>show(cur+1);
const prev = ()=>show(cur-1,true);

document.getElementById("nextBtn").addEventListener("click",e=>{e.stopPropagation();next();});
document.getElementById("prevBtn").addEventListener("click",e=>{e.stopPropagation();prev();});
document.addEventListener("keydown",e=>{
  if(["ArrowRight"," ","Enter","PageDown"].includes(e.key)){e.preventDefault();next();}
  if(["ArrowLeft","Backspace","PageUp"].includes(e.key)){e.preventDefault();prev();}
  if(e.key==="Home")show(0);
  if(e.key==="End")show(els.length-1);
});
stage.addEventListener("click",e=>{
  (e.clientX > window.innerWidth/2) ? next() : prev();
});
let tx=null,ty=null;
stage.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
stage.addEventListener("touchend",e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) dx<0?next():prev();
  tx=ty=null;
},{passive:true});
show(0);
</script>
